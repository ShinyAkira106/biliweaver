<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Biliweaver</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="../icons/icon-48.png" alt="" width="28" height="28">
      <strong>Biliweaver</strong>
      <span class="version" id="version"></span>
    </div>
    <div class="top-actions">
      <span class="saved" id="saved" role="status" aria-live="polite"></span>
      <button class="link-button" id="reset">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4h4"/></svg>
        <span data-i18n="reset"></span>
      </button>
    </div>
  </header>

  <div class="update" id="update" hidden>
    <div class="update-text">
      <strong id="updateTitle"></strong>
      <span id="updateDesc"></span>
    </div>
    <a class="field-button primary" id="updateDownload" target="_blank" rel="noopener noreferrer"></a>
    <a class="field-button" id="updateNotes" target="_blank" rel="noopener noreferrer"></a>
  </div>

  <div class="layout">
    <nav class="sidebar" id="nav" aria-label="Biliweaver"></nav>
    <main class="content" id="content"></main>
  </div>

  <script src="../shared/settings.js"></script>
  <script src="../shared/i18n.js"></script>
  <script src="options.js"></script>
</body>
</html>
