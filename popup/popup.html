<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Biliweaver</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="../icons/icon-48.png" alt="" width="28" height="28">
    <div class="title">
      <strong>Biliweaver</strong>
      <span id="version"></span>
    </div>
    <button class="icon-button" id="openOptions" data-i18n-title="allSettings" data-i18n-aria="allSettings">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7.4 7.4 0 0 0-1.7-1L15 3.5h-4L10.6 6a7.4 7.4 0 0 0-1.7 1l-2.4-1-2 3.4 2 1.6a7.6 7.6 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a7.4 7.4 0 0 0 1.7 1l.4 2.5h4l.4-2.5a7.4 7.4 0 0 0 1.7-1l2.4 1 2-3.4-2-1.6ZM13 15.5A3.5 3.5 0 1 1 13 8.5a3.5 3.5 0 0 1 0 7Z" transform="translate(-1 0)"/></svg>
    </button>
    <label class="switch big" data-i18n-title="enabled">
      <input type="checkbox" data-key="enabled" data-i18n-aria="enabled">
      <span></span>
    </label>
  </header>

  <section class="stats" id="stats">
    <div><b id="speed">0</b><small data-i18n="speed"></small></div>
    <div><b id="threads">0</b><small data-i18n="threadsNow"></small></div>
    <div><b id="bytes">0</b><small data-i18n="accelerated"></small></div>
  </section>
  <p class="hint" id="pageHint"></p>
  <div class="notices" id="notices"></div>

  <section>
    <h2 data-i18n="secVideo"></h2>
    <label class="row">
      <span data-i18n="threads"></span>
      <select data-key="threads" data-number>
        <option>2</option><option>4</option><option>8</option><option>12</option>
        <option>16</option><option>24</option><option>32</option>
      </select>
    </label>
    <label class="row">
      <span data-i18n="cdn"></span>
      <select data-key="cdn">
        <option value="auto" data-i18n="cdnAutoLong"></option>
        <option value="mainland" data-i18n="cdnMainlandLong"></option>
        <option value="overseas" data-i18n="cdnOverseasLong"></option>
        <option value="original" data-i18n="cdnOriginalLong"></option>
        <option value="custom" data-i18n="cdnCustom"></option>
      </select>
    </label>
    <label class="row">
      <span data-i18n="prefetch"></span>
      <span class="switch"><input type="checkbox" data-key="prefetch"><span></span></span>
    </label>
    <label class="row">
      <span data-i18n="avoidPcdnLong"></span>
      <span class="switch"><input type="checkbox" data-key="avoidPcdn"><span></span></span>
    </label>
  </section>

  <section>
    <h2 data-i18n="secLive"></h2>
    <label class="row">
      <span data-i18n="live"></span>
      <span class="switch"><input type="checkbox" data-key="live"><span></span></span>
    </label>
    <label class="row">
      <span data-i18n="preferHls"></span>
      <span class="switch"><input type="checkbox" data-key="preferHls"><span></span></span>
    </label>
  </section>

  <section id="hostSection" hidden>
    <table>
      <thead><tr><th data-i18n="colHost"></th><th data-i18n="colSpeed"></th><th data-i18n="colData"></th></tr></thead>
      <tbody id="hosts"></tbody>
    </table>
  </section>

  <footer>
    <div><span data-i18n="reloadHint"></span><span id="saved"></span></div>
    <div class="credit">
      <span data-i18n="copyright"></span>
      <a id="github" href="https://github.com/ShinyAkira106/biliweaver" target="_blank" rel="noopener noreferrer">GitHub</a>
    </div>
  </footer>
  <script src="../shared/settings.js"></script>
  <script src="../shared/i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
